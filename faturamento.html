<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script src="/demo/demo.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faturamento - Auto Vidros Sport</title>
  <link rel="stylesheet" href="/css/estilo.css">
  <link rel="icon" href="/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icone-192.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#c62828">
  <script src="/js/tema.js"></script>
  <script src="/js/atalhos.js"></script>
  <script src="/js/gerente.js"></script>
</head>
<body>
  <header>
    <a href="/" class="marca">
      <div class="logo">AV</div>
      <h1>Auto Vidros Sport<small>FINANCEIRO</small></h1>
    </a>
    <button id="btnTema" class="btn-tema" type="button">Modo escuro</button>
  </header>

  <main>
    <div class="abas">
      <a class="aba" href="/caixa.html">Caixa do dia</a>
      <a class="aba ativa" href="/faturamento.html">Faturamento</a>
      <a class="aba" href="/despesas.html">Despesas</a>
    </div>

    <div class="card">
      <h2>Análise de faturamento</h2>
      <div class="abas" id="abasAnalise">
        <button type="button" class="aba ativa" data-modo="dia">Dia</button>
        <button type="button" class="aba" data-modo="semana">Semana</button>
        <button type="button" class="aba" data-modo="mes">Mês</button>
        <button type="button" class="aba" data-modo="ano">Ano</button>
      </div>
      <div class="busca-linha">
        <label for="ref" style="align-self:center;font-weight:600">Referência:</label>
        <input type="date" id="ref" class="busca">
        <button id="btnRefHoje" class="secundario" type="button">Hoje</button>
      </div>
      <div id="analiseMensagens"></div>
      <div id="analiseResumo"></div>
      <div class="tabela-envolve" style="margin-top:14px">
        <canvas id="grafico" style="width:100%;height:260px"></canvas>
      </div>
    </div>
  </main>

  <script>
    const abasAnalise = document.getElementById('abasAnalise');
    const campoRef = document.getElementById('ref');
    const btnRefHoje = document.getElementById('btnRefHoje');
    const analiseMensagens = document.getElementById('analiseMensagens');
    const analiseResumo = document.getElementById('analiseResumo');
    const grafico = document.getElementById('grafico');

    function escapeHtml(texto) {
      if (texto === null || texto === undefined) return '';
      return String(texto).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function formatarMoeda(v) {
      const n = Number(v) || 0;
      return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function hojeISO() {
      return new Date().toLocaleDateString('en-CA');
    }

    let modoAnalise = 'dia';
    let dadosGrafico = null;
    const graficoBarras = [];

    function referenciaPadrao() {
      if (modoAnalise === 'mes') return hojeISO().slice(0, 7);
      if (modoAnalise === 'ano') return String(new Date().getFullYear());
      return hojeISO();
    }

    function configurarRef() {
      const tipoEsperado = modoAnalise === 'mes' ? 'month' : modoAnalise === 'ano' ? 'number' : 'date';
      if (campoRef.type !== tipoEsperado || !campoRef.value) {
        campoRef.type = tipoEsperado;
        if (modoAnalise === 'ano') {
          campoRef.min = '2000';
          campoRef.max = '2100';
          campoRef.step = '1';
        }
        campoRef.value = referenciaPadrao();
      }
    }

    async function carregarAnalise() {
      const ref = campoRef.value;
      analiseMensagens.replaceChildren();
      if (!ref) return;
      const params = new URLSearchParams({ modo: modoAnalise });
      if (modoAnalise === 'mes') params.set('mes', ref);
      else if (modoAnalise === 'ano') params.set('ano', ref);
      else params.set('data', ref);
      try {
        const resp = await fetch('/api/caixa/grafico?' + params.toString());
        const dados = await resp.json();
        if (!resp.ok) {
          const div = document.createElement('div');
          div.className = 'erro';
          div.textContent = dados.erro || 'Erro ao carregar a análise.';
          analiseMensagens.appendChild(div);
          return;
        }
        dadosGrafico = dados;
        renderAnaliseResumo(dados);
        desenharGrafico(dados);
      } catch (e) {
        const div = document.createElement('div');
        div.className = 'erro';
        div.textContent = 'Erro ao carregar a análise.';
        analiseMensagens.appendChild(div);
      }
    }

    function formatarVariacao(v) {
      if (v === null || v === undefined) return '—';
      return (v > 0 ? '+' : '') + String(v).replace('.', ',') + '%';
    }

    function classeVariacao(v) {
      if (v === null || v === undefined) return 'var-neutra';
      return v >= 0 ? 'var-positiva' : 'var-negativa';
    }

    function renderAnaliseResumo(d) {
      const corResultado = d.resultado_atual < 0 ? 'var-negativa' : 'var-positiva';
      const botaoCaixa = d.data_dia
        ? '<a class="secundario" href="/caixa.html?data=' + encodeURIComponent(d.data_dia) + '" style="text-decoration:none;padding:8px 14px;border-radius:6px;display:inline-block;margin-top:12px">Ver Caixa do dia (' + escapeHtml(dataBR(d.data_dia)) + ')</a>'
        : '';
      analiseResumo.innerHTML = `
        <div class="resumos" style="margin-top:12px">
          <div class="card-resumo"><div class="rotulo">Faturamento</div><div class="valor">${formatarMoeda(d.total_atual)}</div></div>
          <div class="card-resumo"><div class="rotulo">Despesas</div><div class="valor">${formatarMoeda(d.despesas_atual)}</div></div>
          <div class="card-resumo"><div class="rotulo">Resultado líquido</div><div class="valor ${corResultado}">${formatarMoeda(d.resultado_atual)}</div></div>
          <div class="card-resumo"><div class="rotulo">Documentos</div><div class="valor">${d.quantidade_atual}</div></div>
          <div class="card-resumo"><div class="rotulo">Variação vs. anterior</div><div class="valor ${classeVariacao(d.variacao_percentual)}">${formatarVariacao(d.variacao_percentual)}</div></div>
          <div class="card-resumo"><div class="rotulo">Período anterior</div><div class="valor">${formatarMoeda(d.total_anterior)}</div></div>
        </div>
        <p style="margin:12px 0 0;font-size:14px">${escapeHtml(d.rotulo_atual)} · anterior: ${escapeHtml(d.rotulo_anterior)}</p>
        ${botaoCaixa}`;
    }

    function dataBR(iso) {
      const [ano, mes, dia] = iso.split('-');
      return dia + '/' + mes + '/' + ano;
    }

    function corTema(nome, padrao) {
      return getComputedStyle(document.documentElement).getPropertyValue(nome).trim() || padrao;
    }

    function formatarValorEixo(v) {
      const n = Number(v) || 0;
      if (n >= 1000) return 'R$ ' + (n / 1000).toFixed(1).replace('.', ',') + 'k';
      return 'R$ ' + n.toFixed(0);
    }

    function desenharGrafico(d) {
      const serie = d.serie || [];
      const container = grafico.parentElement;
      const largura = container.clientWidth;
      const altura = 260;
      if (!largura) return;

      const dpr = window.devicePixelRatio || 1;
      grafico.width = largura * dpr;
      grafico.height = altura * dpr;
      grafico.style.width = largura + 'px';
      grafico.style.height = altura + 'px';
      const ctx = grafico.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, largura, altura);

      const corBarra = corTema('--vermelho', '#c62828');
      const corSuave = corTema('--texto-suave', '#6b7280');
      const corBorda = corTema('--borda', '#e2e4e8');

      const margem = { t: 14, r: 8, b: 24, l: 48 };
      const areaW = largura - margem.l - margem.r;
      const areaH = altura - margem.t - margem.b;
      const maxY = Math.max(0, ...serie.map(s => s.valor)) || 1;
      const n = serie.length;

      const passosY = 4;
      for (let i = 0; i <= passosY; i++) {
        const y = margem.t + areaH - (areaH * i) / passosY;
        ctx.strokeStyle = corBorda;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(margem.l, y);
        ctx.lineTo(largura - margem.r, y);
        ctx.stroke();
        ctx.fillStyle = corSuave;
        ctx.font = '11px Segoe UI, Arial, sans-serif';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillText(formatarValorEixo((maxY * i) / passosY), margem.l - 6, y);
      }

      graficoBarras.length = 0;
      if (n > 0) {
        const slot = areaW / n;
        const barraW = Math.max(1, Math.min(34, slot * 0.62));
        serie.forEach((s, idx) => {
          const h = Math.max(0, (s.valor / maxY) * areaH);
          const x = margem.l + idx * slot + (slot - barraW) / 2;
          const y = margem.t + areaH - h;
          ctx.fillStyle = corBarra;
          ctx.fillRect(x, y, barraW, h);
          graficoBarras.push({ x, y, w: barraW, h, item: s });
        });

        ctx.fillStyle = corSuave;
        ctx.font = '10px Segoe UI, Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        const passo = Math.max(1, Math.ceil(n / 12));
        for (let idx = 0; idx < n; idx += passo) {
          ctx.fillText(serie[idx].rotulo, margem.l + idx * slot + slot / 2, margem.t + areaH + 6);
        }
        if (n > 1 && (n - 1) % passo !== 0) {
          ctx.fillText(serie[n - 1].rotulo, margem.l + (n - 1) * slot + slot / 2, margem.t + areaH + 6);
        }
      }
    }

    function criaTooltip() {
      const tt = document.createElement('div');
      tt.id = 'tooltipGrafico';
      tt.style.cssText = 'position:absolute;display:none;pointer-events:none;background:var(--card-bg);color:var(--texto);border:1px solid var(--borda);border-radius:6px;padding:8px 10px;font-size:13px;box-shadow:var(--sombra);z-index:10;line-height:1.4';
      grafico.parentElement.style.position = 'relative';
      grafico.parentElement.appendChild(tt);
      return tt;
    }

    function mostrarTooltip(idx, ev) {
      const b = graficoBarras[idx];
      if (!b) return;
      const cont = grafico.parentElement.getBoundingClientRect();
      const tt = document.getElementById('tooltipGrafico') || criaTooltip();
      tt.innerHTML = `<strong>${escapeHtml(b.item.rotulo)}</strong><br>${formatarMoeda(b.item.valor)}<br>${b.item.quantidade} doc.`;
      tt.style.display = 'block';
      let left = ev.clientX - cont.left + 14;
      if (left + tt.offsetWidth > cont.width - 6) left = ev.clientX - cont.left - tt.offsetWidth - 14;
      tt.style.left = left + 'px';
      tt.style.top = (ev.clientY - cont.top - tt.offsetHeight - 10) + 'px';
    }

    function ocultarTooltip() {
      const tt = document.getElementById('tooltipGrafico');
      if (tt) tt.style.display = 'none';
    }

    grafico.addEventListener('mousemove', (ev) => {
      if (!graficoBarras.length) return;
      const r = grafico.getBoundingClientRect();
      const mx = ev.clientX - r.left;
      const my = ev.clientY - r.top;
      const idx = graficoBarras.findIndex(b => mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h);
      if (idx >= 0) mostrarTooltip(idx, ev);
      else ocultarTooltip();
    });
    grafico.addEventListener('mouseleave', ocultarTooltip);

    abasAnalise.querySelectorAll('.aba').forEach((btn) => {
      btn.addEventListener('click', () => {
        abasAnalise.querySelectorAll('.aba').forEach((b) => b.classList.remove('ativa'));
        btn.classList.add('ativa');
        modoAnalise = btn.dataset.modo;
        btnRefHoje.textContent = modoAnalise === 'dia' ? 'Hoje' : 'Atual';
        configurarRef();
        carregarAnalise();
      });
    });

    btnRefHoje.addEventListener('click', () => {
      campoRef.value = referenciaPadrao();
      carregarAnalise();
    });

    campoRef.addEventListener('change', carregarAnalise);
    window.addEventListener('resize', () => {
      if (dadosGrafico) desenharGrafico(dadosGrafico);
    });

    const observadorTema = new MutationObserver(() => {
      if (dadosGrafico) desenharGrafico(dadosGrafico);
    });
    observadorTema.observe(document.documentElement, { attributes: true, attributeFilter: ['data-tema'] });

    configurarRef();
    carregarAnalise();
  </script>
</body>
</html>
