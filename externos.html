<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script src="/demo/demo.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serviços externos - Auto Vidros Sport</title>
  <link rel="stylesheet" href="/css/estilo.css">
  <link rel="icon" href="/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icone-192.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#c62828">
  <script src="/js/tema.js"></script>
  <script src="/js/atalhos.js"></script>
  <script src="/js/gerente.js"></script>
</head>
<body>
  <header>
    <a href="/" class="marca">
      <div class="logo">AV</div>
      <h1>Auto Vidros Sport<small>ORDEM DE SERVIÇO</small></h1>
    </a>
    <button id="btnTema" class="btn-tema" type="button">Modo escuro</button>
  </header>

  <main class="os-main">
    <div style="margin-bottom:10px">
      <a href="/" class="btn-voltar">← Painel</a>
    </div>

    <div id="mensagens"></div>

    <div class="barra-titulo">
      <h1>Serviços externos</h1>
      <button id="btnNovaExterna" class="sucesso" type="button">Nova externa</button>
    </div>

    <div class="os-secao">
      <h2>Agenda</h2>
      <div class="agenda-layout">
        <div class="cal cal-grande">
          <div class="cal-cab">
            <button id="calAnt" type="button" title="Mês anterior">‹</button>
            <span id="calTitulo"></span>
            <button id="calProx" type="button" title="Próximo mês">›</button>
          </div>
          <div class="cal-semana">
            <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
          </div>
          <div id="calDias" class="cal-grade"></div>
        </div>

        <!-- Ao lado do calendário: o que tem para hoje, sem precisar clicar
             em nenhum dia. -->
        <aside class="painel-lateral" aria-labelledby="tituloHoje">
          <h3 id="tituloHoje">Serviços para hoje</h3>
          <p class="painel-data" id="dataHoje"></p>
          <div id="listaHoje"><p class="aviso-vazio">Carregando...</p></div>
        </aside>
      </div>
      <div id="agendaDia"></div>
    </div>

    <div class="os-secao" style="padding:0;overflow:hidden">
      <div style="padding:14px 16px 0">
        <div class="planilha-toolbar" style="margin-bottom:0">
          <div class="busca-3linhas">
            <input type="text" id="busca" class="busca" placeholder="" autocomplete="off">
            <input type="text" id="busca2" class="busca" placeholder="" autocomplete="off">
            <input type="text" id="busca3" class="busca" placeholder="" autocomplete="off">
          </div>
          <div class="busca-acoes">
            <select id="filtroStatus">
              <option value="">Todos os status</option>
              <option value="recepcao">Aberta</option>
              <option value="concluida">Concluída</option>
              <option value="cancelada">Cancelada</option>
            </select>
            <button id="btnBuscar">Buscar</button>
            <button id="btnLimpar" class="secundario">Limpar</button>
          </div>
        </div>
      </div>
      <div style="overflow:auto;max-height:calc(100vh - 320px)">
        <table class="planilha-tabela" id="tabelaExternos">
          <thead>
            <tr>
              <th style="width:100px">Número</th>
              <th style="width:160px">Agendado</th>
              <th style="width:240px">Cliente</th>
              <th style="width:110px">Placa</th>
              <th>Endereço</th>
              <th style="width:130px">Status</th>
              <th style="width:120px">Valor (R$)</th>
              <th style="width:170px">Ações</th>
            </tr>
          </thead>
          <tbody id="corpoTabela"></tbody>
        </table>
      </div>
      <div class="planilha-rodape">
        <span id="contador"></span>
        <button id="btnCarregarMais" class="secundario">Carregar mais</button>
      </div>
    </div>
  </main>

  <script>
    const mensagens = document.getElementById('mensagens');

    const ROTULO_STATUS = {
      recepcao: 'Aberta', orcamento: 'Orçamento', execucao: 'Execução',
      concluida: 'Concluída', cancelada: 'Cancelada',
    };

    const PERIODO_LABEL = { manha: 'Matutino', tarde: 'Vespertino', dia: 'Durante o dia' };

    function rotuloPeriodo(item) {
      const p = item && item.periodo ? PERIODO_LABEL[item.periodo] : null;
      if (p) return p;
      const d = new Date(item && item.data_agendamento);
      if (Number.isNaN(d.getTime())) return '—';
      const h = d.getHours();
      return h < 12 ? 'Matutino' : h < 18 ? 'Vespertino' : 'Durante o dia';
    }

    function formatarDataAgendada(item) {
      if (!item || !item.data_agendamento) return '—';
      return mascaraData(item.data_agendamento) + ' · ' + rotuloPeriodo(item);
    }

    const TAM_PAGINA = 100;
    let paginaAtual = 0;
    let totalRegistros = 0;
    let cache = [];

    let mesAtual = new Date();
    mesAtual = new Date(mesAtual.getFullYear(), mesAtual.getMonth(), 1);
    let diaSelecionado = null;
    let agendaMes = [];

    function escapeHtml(texto) {
      if (texto === null || texto === undefined) return '';
      return String(texto).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function formatarMoeda(v) {
      if (v === null || v === undefined || v === '') return '—';
      return Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function mascaraData(v) {
      const d = new Date(v);
      return isValidDate(d) ? d.toLocaleDateString('pt-BR') : (String(v || '').slice(0, 16).replace('T', ' '));
    }

    function isValidDate(d) {
      return !Number.isNaN(d.getTime());
    }

    function chaveData(ano, mes, dia) {
      const p = n => String(n).padStart(2, '0');
      return ano + '-' + p(mes + 1) + '-' + p(dia);
    }

    function statusBadge(status) {
      return '<span class="status-os ' + escapeHtml(status) + '">' + escapeHtml(ROTULO_STATUS[status] || status) + '</span>';
    }

    function mostrarMensagem(texto, tipo) {
      mensagens.replaceChildren();
      const div = document.createElement('div');
      div.className = tipo;
      div.textContent = texto;
      mensagens.appendChild(div);
      setTimeout(() => mensagens.replaceChildren(), tipo === 'erro' ? 10000 : 4000);
    }

    async function lerJson(resp) {
      const dados = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(dados.erro || 'Erro na operação.');
      return dados;
    }

    // =====================================================
    // Mini calendário / agenda
    // =====================================================
    function padraoDia(d) {
      const p = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    }

    async function carregarAgendaMes() {
      const ultimo = new Date(mesAtual.getFullYear(), mesAtual.getMonth() + 1, 0).getDate();
      const desde = padraoDia(mesAtual);
      const ate = chaveData(mesAtual.getFullYear(), mesAtual.getMonth(), ultimo);
      const params = new URLSearchParams({ inicio: desde, fim: ate });
      try {
        const resp = await fetch('/api/ordens-servico/agenda?' + params.toString());
        const dados = await lerJson(resp);
        agendaMes = dados.agendamentos || [];
      } catch (e) {
        agendaMes = [];
        mostrarMensagem('Falha ao carregar a agenda.', 'erro');
      }
    }

    function porDia(dados) {
      const mapa = {};
      for (const a of dados) {
        const d = new Date(a.data_agendamento);
        if (!isValidDate(d)) continue;
        const k = padraoDia(d);
        if (!mapa[k]) mapa[k] = [];
        mapa[k].push(a);
      }
      return mapa;
    }

    function renderCalendario() {
      const hoje = new Date();
      const hojeChave = padraoDia(hoje);
      const primeiroDiaSemana = new Date(mesAtual.getFullYear(), mesAtual.getMonth(), 1);
      const qtdDias = new Date(mesAtual.getFullYear(), mesAtual.getMonth() + 1, 0).getDate();
      // Semana começando no DOMINGO, igual ao cabeçalho (D S T Q Q S S).
      // Antes a conta começava na segunda e cada dia aparecia uma coluna
      // antes da letra certa (ex.: terça 22/09 debaixo do "S" de segunda).
      const inicioGrade = primeiroDiaSemana.getDay();
      const primeiro = new Date(mesAtual.getFullYear(), mesAtual.getMonth(), 1 - inicioGrade);

      const mapa = porDia(agendaMes);
      const titulo = mesAtual.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
      document.getElementById('calTitulo').textContent = titulo.charAt(0).toUpperCase() + titulo.slice(1);

      const grade = document.getElementById('calDias');
      grade.innerHTML = '';
      for (let i = 0; i < 42; i++) {
        const dt = new Date(primeiro.getFullYear(), primeiro.getMonth(), primeiro.getDate() + i);
        const chave = padraoDia(dt);
        const doMes = dt.getMonth() === mesAtual.getMonth();
        const hojeDia = chave === hojeChave;
        const sel = chave === diaSelecionado;
        const contagem = (mapa[chave] || []).length;
        const celula = document.createElement('div');
        celula.className = 'cal-dia' + (doMes ? '' : ' fora') + (hojeDia ? ' hoje' : '') + (sel ? ' sel' : '') + (contagem ? ' tem' : '');
        celula.dataset.dia = chave;
        celula.innerHTML = '<span class="num">' + dt.getDate() + '</span>' + (contagem ? '<span class="conta" title="' + contagem + ' agendado(s)">' + contagem + '</span>' : '');
        celula.addEventListener('click', () => selecionarDia(chave));
        grade.appendChild(celula);
      }
      renderAgendaDia(mapa);
    }

    function selecionarDia(chave) {
      diaSelecionado = diaSelecionado === chave ? null : chave;
      renderCalendario();
    }

    // Painel "Serviços para hoje", ao lado do calendário. Busca só o dia de
    // hoje, independente do mês que estiver aberto no calendário.
    async function carregarHoje() {
      const el = document.getElementById('listaHoje');
      const hoje = padraoDia(new Date());
      document.getElementById('dataHoje').textContent =
        new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
      let lista = [];
      try {
        const dados = await lerJson(await fetch('/api/ordens-servico/agenda?inicio=' + hoje + '&fim=' + hoje));
        lista = dados.agendamentos || [];
      } catch (e) {
        el.innerHTML = '<p class="aviso-vazio">Não foi possível carregar os serviços de hoje.</p>';
        return;
      }
      if (!lista.length) {
        el.innerHTML = '<p class="aviso-vazio">Nenhum serviço externo agendado para hoje.</p>';
        return;
      }
      el.innerHTML = '<ul class="lista-lateral">' + lista.map(a => `
        <li>
          <div class="lateral-topo">
            <span class="lateral-hora">${escapeHtml(rotuloPeriodo(a))}</span>
            ${statusBadge(a.status)}
          </div>
          <div class="lateral-titulo"><strong>nº ${escapeHtml(a.codigo)}</strong> · ${escapeHtml(a.cliente_nome || 'Sem cliente')}${a.placa ? ' · ' + escapeHtml(a.placa) : ''}</div>
          ${a.endereco ? '<div class="lateral-sub">' + escapeHtml(a.endereco) + '</div>' : ''}
          <div class="lateral-acoes">
            <button type="button" class="btn-mini" data-abrir="${a.id}">Abrir</button>
            <button type="button" class="btn-mini azul" data-pdf="${a.id}">PDF</button>
          </div>
        </li>`).join('') + '</ul>';
    }

    function renderAgendaDia(mapa) {
      const el = document.getElementById('agendaDia');
      const lista = (mapa[diaSelecionado] || []).sort((a, b) => String(a.data_agendamento).localeCompare(String(b.data_agendamento)));
      if (!diaSelecionado) {
        el.innerHTML = '<p class="aviso-vazio" style="margin-top:12px">Clique em um dia para ver os agendamentos.</p>';
        return;
      }
      if (lista.length === 0) {
        el.innerHTML = '<p class="aviso-vazio" style="margin-top:12px">Nenhum serviço externo agendado para <strong>' + escapeHtml(mascaraData(diaSelecionado + 'T00:00:00')) + '</strong>.</p>';
        return;
      }
      el.innerHTML = '<h2 style="margin-top:14px">Agendados em ' + escapeHtml(mascaraData(diaSelecionado + 'T00:00:00')) + ' (' + lista.length + ')</h2>' +
        '<div class="os-acoes" style="flex-direction:column;align-items:stretch;gap:8px;margin-top:8px">' +
        lista.map(a => `
          <div class="cal-agenda">
            <span class="cal-hora">${escapeHtml(rotuloPeriodo(a))}</span>
            <span class="cal-info"><strong>nº ${escapeHtml(a.codigo)}</strong> · ${a.cliente_nome ? (a.cliente_id ? '<a href="/clientes.html?id=' + a.cliente_id + '">' + escapeHtml(a.cliente_nome) + '</a>' : escapeHtml(a.cliente_nome)) : '—'}${a.placa ? ' · ' + escapeHtml(a.placa) : ''}</span>
            <span class="cal-status">${statusBadge(a.status)}</span>
            <span class="cal-acoes">
              <button type="button" class="btn-mini" data-abrir="${a.id}">Abrir</button>
              <button type="button" class="btn-mini azul" data-pdf="${a.id}">PDF</button>
            </span>
          </div>`).join('') +
        '</div>';
    }

    // =====================================================
    // Lista de serviços externos
    // =====================================================
    function acoesLinha(o) {
      const excluir = o.status === 'cancelada'
        ? '<button type="button" class="btn-mini secundario" data-excluir="' + o.id + '" data-trava-gerente>Excluir</button>'
        : '';
      return '<div class="acoes-celula">' +
        '<button type="button" class="btn-mini" data-abrir="' + o.id + '">Abrir</button>' +
        '<button type="button" class="btn-mini azul" data-pdf="' + o.id + '">PDF</button>' + excluir + '</div>';
    }

    function montarLinha(o) {
      return `
        <tr>
          <td><strong>${escapeHtml(o.codigo)}</strong></td>
          <td>${formatarDataAgendada(o)}</td>
          <td class="rolavel" title="${escapeHtml(o.cliente_nome || '')}">${o.cliente_nome ? (o.cliente_id ? '<a href="/clientes.html?id=' + o.cliente_id + '">' + escapeHtml(o.cliente_nome) + '</a>' : escapeHtml(o.cliente_nome)) : '—'}</td>
          <td>${o.placa ? escapeHtml(o.placa) : '—'}</td>
          <td class="rolavel" title="${escapeHtml(o.endereco || '')}">${escapeHtml(o.endereco || '—')}</td>
          <td>${statusBadge(o.status)}</td>
          <td>${formatarMoeda(o.valor_total)}</td>
          <td>${acoesLinha(o)}</td>
        </tr>`;
    }

    async function buscarExternos(reset) {
      const tbody = document.getElementById('corpoTabela');
      const contador = document.getElementById('contador');
      const q = [document.getElementById('busca').value, document.getElementById('busca2').value, document.getElementById('busca3').value]
        .map(v => v.trim()).filter(Boolean).join(' ');

      if (reset) {
        paginaAtual = 0;
        cache = [];
        tbody.innerHTML = '';
      }

      const params = new URLSearchParams();
      params.append('tipo', 'externo');
      if (q) params.append('q', q);
      const status = document.getElementById('filtroStatus').value;
      if (status) params.append('status', status);
      params.append('ordem', 'abertura');
      params.append('dir', 'desc');
      params.append('inicio', paginaAtual * TAM_PAGINA);
      params.append('limite', TAM_PAGINA);

      let dados;
      try {
        dados = await lerJson(await fetch('/api/ordens-servico?' + params.toString()));
      } catch (e) {
        mostrarMensagem(e.message, 'erro');
        return;
      }

      totalRegistros = dados.total;
      cache = cache.concat(dados.ordens);
      if (dados.ordens.length === 0 && paginaAtual === 0) {
        tbody.innerHTML = '<tr><td colspan="8"><div class="sem-resultados">Nenhum serviço externo encontrado.</div></td></tr>';
      } else {
        tbody.insertAdjacentHTML('beforeend', dados.ordens.map(montarLinha).join(''));
      // "Excluir" (externo cancelado) so no Modo Gerenciador.
      if (window.Gerente) Gerente.aplicarTravas(tbody);
      }
      contador.textContent = cache.length === 0 ? '' : 'Mostrando ' + cache.length + ' de ' + totalRegistros + ' serviços externos.';
      document.getElementById('btnCarregarMais').classList.toggle('oculto', cache.length >= totalRegistros);
    }

    // =====================================================
    // Ações
    // =====================================================
    document.addEventListener('click', e => {
      const botao = e.target.closest('button[data-abrir], button[data-pdf], button[data-excluir]');
      if (!botao) return;
      if (botao.matches('[data-abrir]')) {
        location.href = '/externa.html?id=' + encodeURIComponent(botao.dataset.abrir);
      } else if (botao.matches('[data-pdf]')) {
        window.open('/api/ordens-servico/' + botao.dataset.pdf + '/pdf', '_blank');
      } else if (botao.matches('[data-excluir]')) {
        if (!confirm('Excluir DEFINITIVAMENTE este serviço externo cancelado?\nNão dá para desfazer.')) return;
        excluirExterno(botao.dataset.excluir);
      }
    });

    async function excluirExterno(id) {
      try {
        const resp = await fetch('/api/ordens-servico/' + id, { method: 'DELETE' });
        await lerJson(resp);
        mostrarMensagem('Serviço externo excluído definitivamente.', 'ok');
        buscarExternos(true);
        await usuarioTrocouMes();
        carregarHoje();
      } catch (e) {
        mostrarMensagem(e.message, 'erro');
      }
    }

    async function usuarioTrocouMes() {
      await carregarAgendaMes();
      renderCalendario();
    }

    // ---------- Eventos ----------
    document.getElementById('btnNovaExterna').addEventListener('click', () => {
      location.href = '/externa.html';
    });
    document.getElementById('calAnt').addEventListener('click', async () => {
      mesAtual = new Date(mesAtual.getFullYear(), mesAtual.getMonth() - 1, 1);
      diaSelecionado = null;
      await usuarioTrocouMes();
    });
    document.getElementById('calProx').addEventListener('click', async () => {
      mesAtual = new Date(mesAtual.getFullYear(), mesAtual.getMonth() + 1, 1);
      diaSelecionado = null;
      await usuarioTrocouMes();
    });
    document.getElementById('btnBuscar').addEventListener('click', () => buscarExternos(true));
    ['busca', 'busca2', 'busca3'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') buscarExternos(true); });
    });
    document.getElementById('filtroStatus').addEventListener('change', () => buscarExternos(true));
    document.getElementById('btnLimpar').addEventListener('click', () => {
      document.getElementById('busca').value = '';
      document.getElementById('busca2').value = '';
      document.getElementById('busca3').value = '';
      document.getElementById('filtroStatus').value = '';
      buscarExternos(true);
    });
    document.getElementById('btnCarregarMais').addEventListener('click', () => { paginaAtual += 1; buscarExternos(false); });

    (async function iniciar() {
      await usuarioTrocouMes();
      carregarHoje();
      buscarExternos(true);
    })();
  </script>
</body>
</html>
